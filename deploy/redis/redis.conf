# ==============================================
# jinfu-sys Redis 8.x 配置
# 参考: https://redis.io/docs/latest/operate/oss_and_stack/management/config/
# ==============================================

# 网络
bind 0.0.0.0
port 6379
protected-mode no

# 内存
maxmemory 256mb
maxmemory-policy allkeys-lru

# 持久化 — RDB 快照
save 900 1
save 300 10
save 60 10000

# 持久化 — AOF (追加日志)
appendonly yes
appendfsync everysec

# 日志
loglevel notice
logfile ""

# 慢查询
slowlog-log-slower-than 10000
slowlog-max-len 128

# 安全 — 禁用危险命令
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
