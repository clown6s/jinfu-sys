server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: jinfu-sys-logs
    static_configs:
      - targets:
          - localhost
        labels:
          app: jinfu-sys
          env: prod
          __path__: /var/log/app/*.log

    pipeline_stages:
      # 解析 JSON 日志
      - json:
          expressions:
            timestamp: "@timestamp"
            level: level
            message: message
            logger: logger_name
            thread: thread_name
            traceId: traceId
            spanId: spanId
            userId: userId

      # 时间戳
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000-0700"
          fallback_formats:
            - "2006-01-02T15:04:05.000Z"

      # 日志级别标签
      - labels:
          level:
          traceId:
