# ==============================================
# jinfu-sys 生产部署编排
# 启动: docker compose -f deploy/docker-compose.yml up -d
# 停止: docker compose -f deploy/docker-compose.yml down
# ==============================================
services:
  # ==================== 应用服务 ====================
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: jinfu-sys:${APP_VERSION:-latest}
    container_name: jinfu-sys
    restart: unless-stopped
    pull_policy: build
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # 内置 MySQL（可通过 .env 覆盖为外部库）
      - DB_URL=${DB_URL:-jdbc:mysql://mysql:3306/jinfu_sys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
      - DB_USERNAME=${DB_USERNAME:-jinfu}
      - DB_PASSWORD=${DB_PASSWORD:-jinfu@2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DATABASE=${REDIS_DATABASE:-0}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-jinfu-sys}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      # 生产环境覆盖
      - KNIFE4J_ENABLE=false
      - SPRINGDOC_API_DOCS_ENABLED=false
      - SPRINGDOC_SWAGGER_UI_ENABLED=false
      - P6SPY_ENABLE=false
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
      - LOGGING_LEVEL_COM_JINFU=warn
      - LOGGING_LEVEL_FLOWABLE=warn
      - LOGGING_LEVEL_SPRING=warn
      # 首次启动自动建 Flowable ACT_* 表；表建好后可在 .env 设 FLOWABLE_SCHEMA_UPDATE=false
      - FLOWABLE_SCHEMA_UPDATE=${FLOWABLE_SCHEMA_UPDATE:-true}
      - DB_POOL_MAX=20
      - DB_POOL_MIN=5
      - REDIS_POOL_MAX=16
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Shanghai
      - LOG_PATH=/var/log/jinfu-sys
      - JAVA_OPTS=${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200}
    volumes:
      - app-logs:/var/log/jinfu-sys
    networks:
      - jinfu-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ==================== MySQL 8.4 (LTS) ====================
  # 首次启动自动执行 sql/jinfu_sys.sql 建库建表（业务表）
  # Flowable 的 ACT_* 表由应用首次启动时自动创建
  mysql:
    image: mysql:8.4.11
    container_name: jinfu-mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root@jinfu2026}
      - MYSQL_DATABASE=jinfu_sys
      - MYSQL_USER=${DB_USERNAME:-jinfu}
      - MYSQL_PASSWORD=${DB_PASSWORD:-jinfu@2026}
      - TZ=Asia/Shanghai
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--max_connections=200"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/jinfu_sys.sql:/docker-entrypoint-initdb.d/01-jinfu_sys.sql:ro
    networks:
      - jinfu-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ==================== Redis ====================
  redis:
    image: redis:8.10.0-alpine
    container_name: jinfu-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-}
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - jinfu-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==================== MinIO ====================
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: jinfu-minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio-data:/data
#    ports:
#      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - jinfu-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: jinfu-prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - jinfu-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9090/-/healthy >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:12.4.6
    container_name: jinfu-grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards-provisioning.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - jinfu-net
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==================== Loki (日志聚合) ====================
  loki:
    image: grafana/loki:3.6.11
    container_name: jinfu-loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - jinfu-net
    # distroless 镜像无 shell，无法执行 healthcheck
    # 健康状态通过 Loki API /ready 端点从外部检查

  # ==================== Promtail (日志采集) ====================
  promtail:
    image: grafana/promtail:3.6.11
    container_name: jinfu-promtail
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - app-logs:/var/log/jinfu-sys:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - jinfu-net
    depends_on:
      - loki
    # distroless 镜像无 shell，无法执行 healthcheck

  # ==================== Node Exporter (主机指标) ====================
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: jinfu-node-exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - jinfu-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9100/metrics >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==================== Alertmanager ====================
  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: jinfu-alertmanager
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - 'sed "s|__WECOM_WEBHOOK_URL__|$$WECOM_WEBHOOK_URL|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && exec alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager'
    environment:
      - WECOM_WEBHOOK_URL=${WECOM_WEBHOOK_URL}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - jinfu-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9093/-/healthy >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

# ==================== Volumes ====================
volumes:
  app-logs:
  mysql-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:

# ==================== Network ====================
networks:
  jinfu-net:
    driver: bridge
