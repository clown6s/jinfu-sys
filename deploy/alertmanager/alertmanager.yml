global:
  resolve_timeout: 5m

# 根路由
route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    # 紧急告警 → 企业微信 + 控制台
    - match:
        severity: critical
      receiver: wecom-critical
      repeat_interval: 15m
    # 警告级别
    - match:
        severity: warning
      receiver: wecom-warning
      repeat_interval: 1h

# 接收器
receivers:
  - name: "default"
    webhook_configs:
      - url: "__WECOM_WEBHOOK_URL__"
        send_resolved: true

  - name: "wecom-critical"
    webhook_configs:
      - url: "__WECOM_WEBHOOK_URL__"
        send_resolved: true

  - name: "wecom-warning"
    webhook_configs:
      - url: "__WECOM_WEBHOOK_URL__"
        send_resolved: true

# 抑制规则
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
